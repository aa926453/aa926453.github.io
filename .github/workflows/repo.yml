name: Update Sileo repository

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'build_repo.py'
      - 'index.html'
      - 'CydiaIcon.png'
      - '.github/workflows/repo.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sileo-pages
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build package index
        run: python3 build_repo.py

      - name: Commit updated index only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.bz2 Release
          if ! git diff --cached --quiet; then
            git commit -m "Update package index"
            git push
          fi

      - uses: actions/configure-pages@v5

      - name: Prepare public files (explicit allowlist)
        run: |
          mkdir -p _site/debs
          cp index.html CydiaIcon.png Release Packages Packages.gz Packages.bz2 _site/
          if [ -d debs ]; then cp -r debs/. _site/debs/; fi
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4